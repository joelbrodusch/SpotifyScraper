[project]
name = "spotifyscraper"
version = "2.1.1"
description = "A Python script that queries the Spotify API to fetch the tracks of a playlistand exports them to a .txt file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv"
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]
